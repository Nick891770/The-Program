<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>The Program — Phase 1</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
    background: #0a0a0f;
    color: #e8e8e8;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
  }
  input, textarea, button { font-family: inherit; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 1.25rem 1.25rem 1rem;
    border-bottom: 2px solid #e94560;
    position: sticky; top: 0; z-index: 20;
  }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-phase { font-size: 0.6rem; letter-spacing: 0.2em; color: #e94560; text-transform: uppercase; margin-bottom: 0.2rem; }
  .header-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .btn-ghost {
    background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.3);
    color: #e94560; border-radius: 8px; padding: 0.45rem 0.65rem; cursor: pointer;
    font-size: 0.7rem; display: flex; align-items: center; gap: 0.3rem;
  }
  .btn-primary {
    background: #e94560; border: none; color: white; border-radius: 10px;
    padding: 0.85rem; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    letter-spacing: 0.05em; width: 100%;
  }
  .btn-back {
    background: none; border: none; color: #888; cursor: pointer; padding: 0.25rem;
    display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem;
  }

  .week-selector {
    display: flex; align-items: center; justify-content: center; gap: 1rem;
    padding: 1rem; background: rgba(255,255,255,0.02);
  }
  .week-selector button {
    background: none; border: none; color: #e94560; cursor: pointer; padding: 0.25rem; font-size: 1.1rem;
  }
  .week-selector button:disabled { color: #333; cursor: default; }
  .week-num { font-size: 1.1rem; font-weight: 700; text-align: center; }
  .week-sub { font-size: 0.65rem; color: #888; margin-top: 0.15rem; text-align: center; }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;
    padding: 0 1rem; margin-bottom: 1.25rem;
  }
  .stat-card {
    background: rgba(255,255,255,0.04); border-radius: 10px; padding: 0.75rem 0.5rem;
    text-align: center; border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-value { font-size: 1.3rem; font-weight: 800; color: #e94560; }
  .stat-label { font-size: 0.55rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }
  .stat-sub { font-size: 0.55rem; color: #444; }

  .day-btn {
    width: 100%; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem;
    cursor: pointer; text-align: left; border: 1px solid; color: #e8e8e8;
  }
  .day-btn.day-a {
    background: linear-gradient(135deg, rgba(233,69,96,0.12) 0%, rgba(233,69,96,0.04) 100%);
    border-color: rgba(233,69,96,0.25);
  }
  .day-btn.day-b {
    background: linear-gradient(135deg, rgba(21,101,192,0.12) 0%, rgba(21,101,192,0.04) 100%);
    border-color: rgba(21,101,192,0.25);
  }
  .day-btn-label { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem; }
  .day-btn-sub { font-size: 0.7rem; color: #888; }
  .day-btn-exercises { font-size: 0.6rem; color: #555; margin-top: 0.35rem; }

  .section-bar {
    padding: 0.5rem 1.25rem; font-size: 0.6rem; font-weight: 700;
    color: #e94560; letter-spacing: 0.15em; text-transform: uppercase;
    background: rgba(233,69,96,0.06); border-left: 3px solid #e94560;
  }
  .exercise-row {
    padding: 0.75rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.35rem; }
  .exercise-name { font-size: 0.8rem; font-weight: 600; }
  .exercise-meta { font-size: 0.55rem; color: #666; margin-top: 0.15rem; }
  .exercise-last {
    font-size: 0.55rem; color: #555; background: rgba(255,255,255,0.04);
    padding: 0.2rem 0.4rem; border-radius: 4px; white-space: nowrap;
  }

  .set-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
  .set-num { font-size: 0.6rem; color: #555; min-width: 1.25rem; font-weight: 700; }
  .set-input {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 0.45rem 0.5rem; color: #e8e8e8;
    font-size: 0.8rem; text-align: center;
  }
  .set-input.weight { width: 4rem; }
  .set-input.reps { width: 3.5rem; }
  .set-input.done { border-color: rgba(233,69,96,0.3); }
  .set-check {
    width: 2rem; height: 2rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); color: #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .set-check.checked { border-color: #e94560; background: rgba(233,69,96,0.2); color: #e94560; }

  .btn-add-set {
    margin-top: 0.35rem; background: none; border: none; color: #555;
    cursor: pointer; font-size: 0.6rem; display: flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0;
  }
  .btn-done-toggle {
    margin-top: 0.25rem; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
    padding: 0.4rem 0.75rem; color: #666; cursor: pointer;
    font-size: 0.65rem; display: flex; align-items: center; gap: 0.35rem;
  }
  .btn-done-toggle.checked {
    background: rgba(233,69,96,0.15); border-color: rgba(233,69,96,0.3); color: #e94560;
  }

  .session-feel {
    margin: 1rem; padding: 1rem; background: rgba(255,255,255,0.03);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);

  .feel-label { font-size: 0.6rem; color: #e94560; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.75rem; }
  .feel-sub { font-size: 0.6rem; color: #888; margin-bottom: 0.35rem; }
  .feel-row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .feel-btn {
    min-width: 2.25rem; padding: 0.4rem 0.5rem; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #888; cursor: pointer; font-size: 0.7rem; font-weight: 600;
  }
  .feel-btn.selected { border-color: #e94560; background: rgba(233,69,96,0.2); color: #e94560; }
  .feel-btn.energy.selected { border-color: #5c9ce6; background: rgba(92,156,230,0.15); color: #5c9ce6; }
  .notes-textarea {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 0.5rem; color: #ccc; font-size: 0.7rem; resize: vertical;

  .floating-finish {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem;
    background: linear-gradient(transparent, #0a0a0f 30%); z-index: 10;
  }

  .history-item {
    width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid rgba(255,255,255,0.04); padding: 0.85rem 1.25rem;
    cursor: pointer; color: #e8e8e8; display: flex; justify-content: space-between; align-items: center;
  }
  .history-day { font-size: 0.8rem; font-weight: 600; }
  .history-meta { font-size: 0.6rem; color: #666; margin-top: 0.2rem; }
  .history-weight { font-size: 0.7rem; color: #e94560; font-weight: 700; }

  .detail-tag {
    padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.65rem; font-weight: 600;
  }
  .detail-tag.rpe { background: rgba(233,69,96,0.12); color: #e94560; }
  .detail-tag.energy { background: rgba(92,156,230,0.12); color: #5c9ce6; }
  .detail-set {
    padding: 0.3rem 0.5rem; background: rgba(233,69,96,0.1); border-radius: 5px;
    font-size: 0.65rem; color: #ccc; border: 1px solid rgba(233,69,96,0.2);
  }
  .detail-set.empty { background: rgba(255,255,255,0.03); color: #444; border-color: rgba(255,255,255,0.05); }
  .detail-note {
    margin: 1rem 1.25rem; padding: 0.75rem; background: rgba(255,255,255,0.03);
    border-radius: 8px; border-left: 3px solid rgba(255,255,255,0.1);
  }

  .overview-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .overview-row.active { opacity: 1; }
  .overview-row.inactive { opacity: 0.4; }

  .btn-delete {
    background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.2);
    color: #ff5555; border-radius: 6px; padding: 0.4rem; cursor: pointer;
  }

  .empty-state { text-align: center; padding: 3rem 1rem; color: #444; }
  .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }

  .saving-indicator { text-align: center; padding: 0.5rem; font-size: 0.6rem; color: #e94560; }

  .swap-trigger { cursor: pointer; }
  .swap-hint {
    font-size: 0.5rem; color: #e94560; text-transform: uppercase; letter-spacing: 0.1em;
    margin-left: 0.4rem; opacity: 0.6;
  }
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    max-width: 430px; margin: 0 auto;
    background: #1a1a2e; border-top: 2px solid #e94560; border-radius: 14px 14px 0 0;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
  }
  .sheet-title { font-size: 0.85rem; font-weight: 700; }
  .sheet-sub { font-size: 0.6rem; color: #888; margin: 0.2rem 0 0.75rem; }
  .swap-option {
    display: flex; justify-content: space-between; width: 100%; text-align: left;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    color: #ddd; padding: 0.85rem; font-size: 0.8rem; cursor: pointer;
    border-radius: 8px; margin-bottom: 0.4rem;
  }
  .swap-option:active { background: rgba(233,69,96,0.15); }
  .swap-option.current { color: #e94560; border-color: rgba(233,69,96,0.4); font-weight: 600; }
  .sheet-cancel {
    width: 100%; background: none; border: none; color: #888; padding: 0.75rem;
    font-size: 0.75rem; cursor: pointer; margin-top: 0.25rem;
  }
  .rotation-tag {
    display: inline-block; font-size: 0.55rem; color: #4ade80; background: rgba(74,222,128,0.1);
    padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.35rem;
  }
  .btn-row { display: flex; gap: 0.5rem; }
  .btn-edit {
    background: rgba(92,156,230,0.12); border: 1px solid rgba(92,156,230,0.3);
    color: #5c9ce6; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.65rem;
  }
  .btn-reset {
    display: block; margin: 2rem auto; background: none; border: 1px solid rgba(255,50,50,0.25);
    color: #ff5555; border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.65rem; cursor: pointer;
  }

  @media (min-width: 500px) {
    body { max-width: 430px; margin: 0 auto; border-left: 1px solid #1a1a2e; border-right: 1px solid #1a1a2e; }
  }
</style>
</head>

      ]},
      { name: "COOLDOWN", exercises: [
        { id:"b9", weeks:"odd", name:"Pigeon Stretch + Box Breathing", defaultSets:1, hasWeight:false, note:"4-4-4-4 pattern" },

};

const WEEK_TARGETS = {
  1:{sets:2,reps:"10",rpe:"5-6",label:"Movement quality"},
  2:{sets:2,reps:"10",rpe:"5-6",label:"Movement quality"},
  3:{sets:3,reps:"8-10",rpe:"6-7",label:"Building capacity"},
  4:{sets:3,reps:"8-10",rpe:"6-7",label:"Building capacity"},
  5:{sets:3,reps:"6-8",rpe:"7-8",label:"Progression test"},
  6:{sets:2,reps:"8",rpe:"5",label:"Deload"},
};

// ==================== STATE ====================
let state = {
  view: "home",
  sessions: [],
  currentWeek: 1,
  activeSession: null,
  activeDay: null,
  viewingSession: null,
  sessionRPE: null,
  energyLevel: null,
  sessionNote: "",
  openSwapMenu: null,
  editingId: null,
};

const DRAFT_KEY = "the-program-draft";

function loadData() {
  try {
    const raw = localStorage.getItem("the-program-data");
    if (raw) {
      const d = JSON.parse(raw);
      state.sessions = d.sessions || [];
      state.currentWeek = d.currentWeek || 1;
    }
  } catch(e) {}
  // Restore an in-progress session (e.g. after screen lock or the page reloading)
  try {
    const draft = localStorage.getItem(DRAFT_KEY);
    if (draft) {
      const d = JSON.parse(draft);
      if (d.activeSession && PROGRAM[d.activeDay]) {
        state.activeSession = d.activeSession;
        state.activeDay = d.activeDay;
        state.sessionRPE = d.sessionRPE ?? null;
        state.energyLevel = d.energyLevel ?? null;
        state.sessionNote = d.sessionNote || "";
        state.editingId = d.editingId || null;
        state.view = "workout";
      }
    }
  } catch(e) {}
}

function saveDraft() {
  if (!state.activeSession) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      activeSession: state.activeSession,
      activeDay: state.activeDay,
      sessionRPE: state.sessionRPE,
      energyLevel: state.energyLevel,
      sessionNote: state.sessionNote,
      editingId: state.editingId,
    }));
  } catch(e) {}
}

function clearDraft() {
  try { localStorage.removeItem(DRAFT_KEY); } catch(e) {}
}

// Rotation: exercises tagged "odd" run in weeks 1/3/5, "even" in weeks 2/4/6. Untagged run every week.
function inWeek(ex, week) {
  if (!ex.weeks) return true;
  return (ex.weeks === "odd") === (week % 2 === 1);
}
function rotationLabel(week) { return week % 2 === 1 ? "Rotation 1" : "Rotation 2"; }

function findExercise(dayKey, exId) {
  for (const sec of PROGRAM[dayKey].sections) {
    const ex = sec.exercises.find(e => e.id === exId);
    if (ex) return ex;
  }
  return null;
}

function escapeHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function saveData() {
  try {
    localStorage.setItem("the-program-data", JSON.stringify({
      sessions: state.sessions,
      currentWeek: state.currentWeek,
    }));
  } catch(e) {}
}

function todayStr() {
  return new Date().toISOString().split("T")[0];
}

function formatDate(s) {
  const d = new Date(s + "T00:00:00");
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

function getLastWeight(exerciseId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (state.editingId && s.id === state.editingId) continue;
    if (s.exercises && s.exercises[exerciseId]) {
      const sets = s.exercises[exerciseId].sets;
      for (const set of sets) {
        if (set.weight) return set.weight;
      }
    }
  }
  return null;
}

function getSessionCount() { return state.sessions.filter(s => s.completed).length; }
function getWeekSessions() { return state.sessions.filter(s => s.week === state.currentWeek && s.completed).length; }

function render() {

function renderSingaporeCountdown() {
  const target = new Date("2027-02-27T00:00:00");
  const now = new Date();
  const diff = target - now;
  const days = Math.max(0, Math.floor(diff / (1000*60*60*24)));
  const weeks = Math.floor(days / 7);

  // Running progression phases with date boundaries
  const phases = [
    { id: "gym", label: "Gym Only", sub: "Weeks 1-4 — Build the habit. Two gym sessions per week, walk for cardio.", dateEnd: "2026-11-22", color: "#e94560" },
    { id: "runwalk", label: "Run/Walk", sub: "Weeks 5-10 — Start 1 min run / 2 min walk × 8, twice a week. Add about 30s of running per interval each week, ending with 20 min continuous. Repeat a week any time it felt hard.", dateEnd: "2027-01-03", color: "#f4a261" },
    { id: "continuous", label: "Easy Running + REHIT", sub: "Weeks 11-14 — 20-35 min easy runs, twice a week, at a pace where you can talk. Optional gym finisher: REHIT, 2 × 20s all-out bike sprints with about 3 min easy pedalling between (10 min total).", dateEnd: "2027-01-31", color: "#2a9d8f" },
    { id: "extend", label: "5K+ and 4×4", sub: "Weeks 15-17 — One long easy run, adding about 5 min a week toward 45-60 min. One Norwegian 4×4: 4 min hard (90-95% max HR), 3 min easy jog or brisk walk, × 4.", dateEnd: "2027-02-20", color: "#5c9ce6" },
    { id: "ready", label: "Singapore Ready", sub: "Final week — Ease off: two short easy runs and no hard sessions, so you arrive fresh.", dateEnd: "2027-02-27", color: "#4ade80" },
  ];

  // Determine current phase
  let currentPhase = phases[phases.length - 1];
  for (const phase of phases) {
    if (now <= new Date(phase.dateEnd + "T23:59:59")) {
      currentPhase = phase;
      break;
    }
  }

  let phaseRows = "";
  let foundCurrent = false;
  phases.forEach(p => {
    const isCurrent = p.id === currentPhase.id;
    const isPast = !foundCurrent && !isCurrent;
    if (isCurrent) foundCurrent = true;
    const opacity = isCurrent ? "1" : isPast ? "0.35" : "0.5";
    const border = isCurrent ? `border-left:3px solid ${p.color};padding-left:0.6rem;margin-left:-0.6rem` : "";

    phaseRows += `<div style="padding:0.4rem 0;opacity:${opacity};${border}">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <span style="font-size:0.5rem;width:6px;height:6px;border-radius:50%;background:${p.color};display:inline-block;flex-shrink:0"></span>
        <span style="font-size:0.65rem;font-weight:${isCurrent?'700':'400'};color:${isCurrent?p.color:'#aaa'}">${p.label}</span>
        ${isCurrent?'<span style="font-size:0.5rem;color:#555;background:rgba(255,255,255,0.06);padding:0.1rem 0.35rem;border-radius:3px">NOW</span>':''}
      </div>
      <div style="font-size:0.55rem;color:#666;margin-left:1rem;margin-top:0.15rem">${p.sub}</div>
    </div>`;
  });

  return `
    <div style="margin:1rem 1rem 0;background:linear-gradient(135deg,rgba(74,222,128,0.06) 0%,rgba(92,156,230,0.06) 100%);border-radius:10px;padding:1rem;border:1px solid rgba(74,222,128,0.15)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem">
        <div>
          <div style="font-size:0.6rem;color:#4ade80;text-transform:uppercase;letter-spacing:0.15em;font-weight:700">Singapore 5/10K</div>
          <div style="font-size:0.55rem;color:#666;margin-top:0.15rem">27 Feb 2027</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.4rem;font-weight:800;color:#4ade80">${days}</div>
          <div style="font-size:0.5rem;color:#666;text-transform:uppercase;letter-spacing:0.1em">days (${weeks} wks)</div>
        </div>
      </div>
      <div style="height:1px;background:rgba(255,255,255,0.06);margin-bottom:0.6rem"></div>
      <div style="font-size:0.55rem;color:#555;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem">Running Progression</div>
      ${phaseRows}
      <div style="height:1px;background:rgba(255,255,255,0.06);margin:0.6rem 0"></div>
      <div style="font-size:0.55rem;color:#555;font-style:italic">The test: can you hold a conversation while running? That's the pace.</div>
    </div>
  `;
}

      <div style="display:flex;align-items:center;gap:0.5rem">
        <span style="font-size:0.65rem;font-weight:700;color:${w===state.currentWeek?'#e94560':'#666'};min-width:3rem">Wk ${w}</span>

  const dayAExs = strengthList("dayA");
  const dayBExs = strengthList("dayB");

  app().innerHTML = `

    </div>

    <div style="padding:0 1rem">
      <div style="font-size:0.6rem;color:#555;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:0.75rem">Start Session</div>

          </div>
          ${ICO.dumbbell}
        </div>
      </button>
      <button class="day-btn day-b" onclick="startWorkout('dayB')">
        <div style="display:flex;justify-content:space-between;align-items:center">

          </div>
          ${ICO.dumbbell}
        </div>
      </button>
    </div>

    <div style="margin:1.25rem 1rem 0;background:rgba(255,255,255,0.03);border-radius:10px;padding:1rem;border:1px solid rgba(255,255,255,0.05)">
      <div style="font-size:0.6rem;color:#555;text-transform:uppercase;letter-spacing:0.15em;margin-bottom:0.75rem">Phase 1 Overview</div>
      ${overviewRows}
      <div style="font-size:0.6rem;color:#888;margin-top:0.75rem;line-height:1.5">When to go heavier: if you hit the top of the rep range on every set and it felt at or below the target RPE, add the smallest jump next time (1-2kg dumbbells, 2.5-5kg bar). Reps on the main lifts follow the weekly target. Accessories use the reps in their notes.</div>
    </div>

function renderWorkout() {
  const s = state.activeSession;
  const day = PROGRAM[state.activeDay];
  const wt = WEEK_TARGETS[s.week] || WEEK_TARGETS[1];
  const editing = !!state.editingId;

  let sectionsHTML = "";
  day.sections.forEach(section => {
    const exs = section.exercises.filter(ex => s.exercises[ex.id]);
    if (!exs.length) return;
    sectionsHTML += `<div class="section-bar">${section.name}</div>`;
    exs.forEach(ex => {
      const exData = s.exercises[ex.id];
      const last = getLastWeight(ex.id);
      const displayName = s.swaps[ex.id] || ex.name;
      const metaParts = [ex.anchor?'Anchor lift':'', ex.tempo||'', ex.rest?`Rest: ${ex.rest}`:'', ex.note].filter(Boolean).join(" • ");
      const hasSwaps = ex.swaps && ex.swaps.length > 0;
      const secondField = ex.unit === "secs" ? "secs" : "reps";

      let setsHTML = "";
      if (ex.hasWeight) {
        exData.sets.forEach((set, idx) => {
          const doneClass = set.done ? "done" : "";
          const checkClass = set.done ? "checked" : "";
          setsHTML += `<div class="set-row">
            <div class="set-num">${idx+1}</div>
            <input type="number" inputmode="decimal" placeholder="kg" value="${escapeHTML(set.weight)}" class="set-input weight ${doneClass}" oninput="updateSet('${ex.id}',${idx},'weight',this.value)">
            <input type="number" inputmode="numeric" placeholder="${secondField}" value="${escapeHTML(set.reps)}" class="set-input reps ${doneClass}" oninput="updateSet('${ex.id}',${idx},'reps',this.value)">
            <button class="set-check ${checkClass}" onclick="toggleSet('${ex.id}',${idx})">${ICO.check}</button>
          </div>`;
        });
        setsHTML += `<button class="btn-add-set" onclick="addSet('${ex.id}')">${ICO.plus} Add set</button>`;
      } else {
        const checkClass = exData.sets[0]?.done ? "checked" : "";
        setsHTML = `<button class="btn-done-toggle ${checkClass}" onclick="toggleSet('${ex.id}',0)">${ICO.check} ${exData.sets[0]?.done?'Done':'Mark done'}</button>`;
      }

      sectionsHTML += `<div class="exercise-row">
        <div class="exercise-header">
          <div class="${hasSwaps?'swap-trigger':''}" ${hasSwaps?`onclick="openSwap('${ex.id}')"`:''}>
            <div class="exercise-name">${escapeHTML(displayName)}${hasSwaps?'<span class="swap-hint">⇄ swap</span>':''}</div>
            <div class="exercise-meta">${escapeHTML(metaParts)}</div>
          </div>
          ${last ? `<div class="exercise-last">Last: ${escapeHTML(last)}kg</div>` : ''}
        </div>
        ${setsHTML}
      </div>`;
    });
  });

  // Swap picker as a bottom sheet, rendered outside the exercise list so taps can't fall through
  let sheetHTML = "";
  if (state.openSwapMenu) {
    const ex = findExercise(state.activeDay, state.openSwapMenu);
    if (ex && ex.swaps) {
      const current = s.swaps[ex.id];
      let opts = `<button class="swap-option ${!current?'current':''}" onclick="swapExercise('${ex.id}',-1)"><span>${escapeHTML(ex.name)}</span><span>${!current?'✓':'Default'}</span></button>`;
      ex.swaps.forEach((sw, i) => {
        const isCur = current === sw;
        opts += `<button class="swap-option ${isCur?'current':''}" onclick="swapExercise('${ex.id}',${i})"><span>${escapeHTML(sw)}</span><span>${isCur?'✓':''}</span></button>`;
      });
      sheetHTML = `<div class="sheet-overlay" onclick="closeSwapMenu()"></div>
        <div class="sheet">
          <div class="sheet-title">Swap exercise</div>
          <div class="sheet-sub">Same movement pattern. Applies to this session only.</div>
          ${opts}
          <button class="sheet-cancel" onclick="closeSwapMenu()">Cancel</button>
        </div>`;
    }
  }

  let rpeButtons = "";
  [5,6,7,8,9,10].forEach(r => {
    const sel = state.sessionRPE === r ? "selected" : "";
    rpeButtons += `<button class="feel-btn ${sel}" onclick="setRPE(${r})">${r}</button>`;
  });

  let energyButtons = "";
  ["Low","OK","Good","Great"].forEach(e => {
    const sel = state.energyLevel === e ? "selected" : "";
    energyButtons += `<button class="feel-btn energy ${sel}" onclick="setEnergy('${e}')">${e}</button>`;
  });

  app().innerHTML = `
    <div class="header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <button class="btn-back" onclick="cancelWorkout()">${ICO.chevL} Cancel</button>
        <div style="text-align:center">
          <div style="font-weight:700;font-size:0.95rem">${editing?'Editing ':''}${day.label}</div>
          <div style="font-size:0.6rem;color:#888">${editing?formatDate(s.date)+' • ':''}Wk ${s.week} • ${wt.reps} reps @ RPE ${wt.rpe}</div>
        </div>
        <button class="btn-primary" style="width:auto;padding:0.45rem 0.75rem;font-size:0.7rem" onclick="finishWorkout()">${editing?'Save':'Finish'}</button>
      </div>
    </div>

    ${sectionsHTML}

    <div class="session-feel">
      <div class="feel-label">Session Feel</div>
      <div class="feel-sub">Overall RPE</div>
      <div class="feel-row">${rpeButtons}</div>
      <div class="feel-sub">Energy Level</div>
      <div class="feel-row">${energyButtons}</div>
      <div class="feel-sub">Notes</div>
      <textarea class="notes-textarea" rows="3" placeholder="How'd it feel? Sleep quality? Anything to note..." oninput="state.sessionNote=this.value;saveDraft()">${escapeHTML(state.sessionNote)}</textarea>
    </div>

    <div class="floating-finish">
      <button class="btn-primary" onclick="finishWorkout()">${editing?'SAVE CHANGES':'FINISH & SAVE SESSION'}</button>
    </div>
    <div style="height:5rem"></div>
    ${sheetHTML}
  `;
}

function renderHistory() {
  const sorted = [...state.sessions].sort((a,b) => new Date(b.date) - new Date(a.date));
  let items = "";

  if (sorted.length === 0) {
    items = `<div class="empty-state"><div class="empty-icon">🏋️</div><div style="font-size:0.75rem">No sessions yet</div><div style="font-size:0.6rem;margin-top:0.25rem">Complete a workout to see it here</div></div>`;
  } else {
    sorted.forEach(session => {
      const day = PROGRAM[session.dayKey];
      const strengthExs = day?.sections.filter(s=>s.name==="STRENGTH").flatMap(s=>s.exercises) || [];
      let heaviest = 0;
      strengthExs.forEach(ex => {
        const sets = session.exercises[ex.id]?.sets || [];
        sets.forEach(s => { const w = parseFloat(s.weight)||0; if(w>heaviest) heaviest=w; });
      });
      const color = session.dayKey==="dayA" ? "#e94560" : "#5c9ce6";

      items += `<button class="history-item" onclick="viewSession('${session.id}')">
        <div>
          <div class="history-day"><span style="color:${color}">${session.dayLabel}</span><span style="color:#555;font-weight:400;font-size:0.65rem;margin-left:0.5rem">Wk ${session.week}</span></div>
          <div class="history-meta">${formatDate(session.date)}${session.rpe?' • RPE '+session.rpe:''}${session.energy?' • '+session.energy:''}</div>
        </div>
        <div style="text-align:right">
          ${heaviest>0?`<div class="history-weight">${heaviest}kg</div>`:''}
          ${ICO.chevR}
        </div>
      </button>`;
    });
  }

  app().innerHTML = `
    <div class="header">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <button class="btn-back" onclick="goHome()">${ICO.chevL}</button>
        <div style="font-weight:700;font-size:1rem">Training History</div>
        <div style="margin-left:auto;font-size:0.65rem;color:#666">${state.sessions.length} sessions</div>
      </div>
    </div>
    ${items}
    ${state.sessions.length ? `<button class="btn-reset" onclick="resetAll()">Delete all history and start fresh</button>` : ''}
  `;
}

function renderDetail() {
  const s = state.viewingSession;
  if (!s) return goHistory();
  const day = PROGRAM[s.dayKey];

  let tags = "";
  if (s.rpe) tags += `<span class="detail-tag rpe">RPE ${s.rpe}</span>`;
  if (s.energy) tags += `<span class="detail-tag energy">Energy: ${s.energy}</span>`;

  let sectionsHTML = "";
  day.sections.forEach(section => {
    sectionsHTML += `<div class="section-bar" style="margin-top:0.5rem">${section.name}</div>`;
    section.exercises.forEach(ex => {
      const exData = s.exercises[ex.id];
      if (!exData) return;
      let setsHTML = "";
      if (ex.hasWeight) {
        setsHTML = `<div style="display:flex;gap:0.5rem;flex-wrap:wrap">`;
        exData.sets.forEach(set => {
          if (set.weight) {
            setsHTML += `<div class="detail-set">${escapeHTML(set.weight)}kg × ${escapeHTML(set.reps)||'?'}${ex.unit==='secs'?'s':''}</div>`;
          } else {
            setsHTML += `<div class="detail-set empty">—</div>`;
          }
        });
        setsHTML += `</div>`;
      } else {
        const done = exData.sets[0]?.done;
        setsHTML = `<div style="font-size:0.6rem;color:${done?'#e94560':'#555'}">${done?'✓ Completed':'— Skipped'}</div>`;
      }
      sectionsHTML += `<div style="padding:0.6rem 1.25rem;border-bottom:1px solid rgba(255,255,255,0.03)">
        <div style="font-size:0.75rem;font-weight:600;margin-bottom:0.3rem">${(s.swaps&&s.swaps[ex.id])||ex.name}${s.swaps&&s.swaps[ex.id]?'<span style="font-size:0.5rem;color:#555;margin-left:0.4rem">swapped</span>':''}</div>
        ${setsHTML}
      </div>`;
    });
  });

  let noteHTML = "";
  if (s.note) {
    noteHTML = `<div class="detail-note">
      <div style="font-size:0.55rem;color:#666;margin-bottom:0.3rem;text-transform:uppercase;letter-spacing:0.1em">Notes</div>
      <div style="font-size:0.7rem;color:#aaa;line-height:1.5">${escapeHTML(s.note)}</div>
    </div>`;
  }

  app().innerHTML = `
    <div class="header">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:0.5rem">
          <button class="btn-back" onclick="goHistory()">${ICO.chevL}</button>
          <div>
            <div style="font-weight:700">${s.dayLabel}</div>
            <div style="font-size:0.6rem;color:#888">${formatDate(s.date)} • Week ${s.week}</div>
          </div>
        </div>
        <div class="btn-row">
          <button class="btn-edit" onclick="editSession('${s.id}')">Edit</button>
          <button class="btn-delete" onclick="deleteSession('${s.id}')">${ICO.trash}</button>
        </div>
      </div>
    </div>
    ${tags?`<div style="display:flex;gap:0.75rem;padding:0.75rem 1.25rem;background:rgba(255,255,255,0.02)">${tags}</div>`:''}
    ${sectionsHTML}
    ${noteHTML}
  `;
}

// ==================== ACTIONS ====================
function goHome() { state.view="home"; state.viewingSession=null; render(); }
function goHistory() { state.view="history"; state.viewingSession=null; render(); }

function changeWeek(delta) {
  state.currentWeek = Math.max(1, Math.min(6, state.currentWeek + delta));
  saveData(); render();
}

function startWorkout(dayKey) {
  const day = PROGRAM[dayKey];
  const wt = WEEK_TARGETS[state.currentWeek];
  const session = {
    id: Date.now().toString(),
    date: todayStr(),
    dayKey, dayLabel: day.label,
    week: state.currentWeek,
    exercises: {},
    swaps: {},
    note: "", rpe: null, energy: null, completed: false,
  };
  day.sections.forEach(section => {
    section.exercises.filter(ex => inWeek(ex, state.currentWeek)).forEach(ex => {
      if (ex.hasWeight) {
        const n = Math.min(ex.defaultSets, wt.sets);
        session.exercises[ex.id] = { sets: Array.from({length:n}, ()=>({weight:"",reps:"",done:false})) };
      } else {
        session.exercises[ex.id] = { sets: [{done:false}] };
      }
    });
  });
  state.activeSession = session;
  state.activeDay = dayKey;
  state.sessionRPE = null;
  state.energyLevel = null;
  state.sessionNote = "";
  state.editingId = null;
  state.openSwapMenu = null;
  state.view = "workout";
  saveDraft();
  render();
  window.scrollTo(0,0);
}

function updateSet(exId, idx, field, value) {
  state.activeSession.exercises[exId].sets[idx][field] = value;
  saveDraft();
}

function toggleSet(exId, idx) {
  const set = state.activeSession.exercises[exId].sets[idx];
  set.done = !set.done;
  saveDraft();
  render();
}

function addSet(exId) {
  state.activeSession.exercises[exId].sets.push({weight:"",reps:"",done:false});
  saveDraft();
  render();
}

function openSwap(exId) {
  state.openSwapMenu = exId;
  render();
}

function closeSwapMenu() {
  state.openSwapMenu = null;
  render();
}

function swapExercise(exId, idx) {
  const ex = findExercise(state.activeDay, exId);
  if (ex && idx >= 0 && ex.swaps[idx]) {
    state.activeSession.swaps[exId] = ex.swaps[idx];
  } else {
    delete state.activeSession.swaps[exId];
  }
  state.openSwapMenu = null;
  saveDraft();
  render();
}

function setRPE(val) { state.sessionRPE = val; saveDraft(); render(); }
function setEnergy(val) { state.energyLevel = val; saveDraft(); render(); }

function endActiveSession() {
  state.activeSession = null; state.activeDay = null;
  state.editingId = null; state.openSwapMenu = null;
  clearDraft();
}

function cancelWorkout() {
  const editingId = state.editingId;
  const msg = editingId ? "Discard your changes?" : "Leave without saving?";
  if (!confirm(msg)) return;
  endActiveSession();
  if (editingId) {
    state.viewingSession = state.sessions.find(s => s.id === editingId);
    state.view = "detail";
  } else {
    state.view = "home";
  }
  render();
  window.scrollTo(0,0);
}

function finishWorkout() {
  const s = state.activeSession;
  s.note = state.sessionNote;
  s.rpe = state.sessionRPE;
  s.energy = state.energyLevel;
  s.completed = true;
  const editingId = state.editingId;
  if (editingId) {
    const i = state.sessions.findIndex(x => x.id === editingId);
    if (i >= 0) state.sessions[i] = s; else state.sessions.push(s);
  } else {
    state.sessions.push(s);
  }
  saveData();
  endActiveSession();
  if (editingId) {
    state.viewingSession = s;
    state.view = "detail";
  } else {
    state.view = "home";
  }
  render();
  window.scrollTo(0,0);
}

function editSession(id) {
  const orig = state.sessions.find(s => s.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.swaps = copy.swaps || {};
  state.activeSession = copy;
  state.activeDay = copy.dayKey;
  state.sessionRPE = copy.rpe ?? null;
  state.energyLevel = copy.energy ?? null;
  state.sessionNote = copy.note || "";
  state.editingId = id;
  state.openSwapMenu = null;
  state.view = "workout";
  saveDraft();
  render();
  window.scrollTo(0,0);
}

function resetAll() {
  if (!confirm("Delete ALL saved sessions and start fresh at Week 1? This can't be undone.")) return;
  state.sessions = [];
  state.currentWeek = 1;
  endActiveSession();
  saveData();
  goHome();
}

function viewSession(id) {
  state.viewingSession = state.sessions.find(s => s.id === id);
  state.view = "detail"; render();
  window.scrollTo(0,0);
}

function deleteSession(id) {
  if (confirm("Delete this session?")) {
    state.sessions = state.sessions.filter(s => s.id !== id);
    saveData();
    state.viewingSession = null;
    state.view = "history"; render();
  }
}

// ==================== INIT ====================
loadData();
render();
// Belt and braces: save the in-progress session whenever the app is hidden (screen lock, app switch)
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });
window.addEventListener("pagehide", saveDraft);
</script>
</body>
</html>
