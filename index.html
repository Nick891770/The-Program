<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>The Program — Phase 1</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
    background: #0a0a0f;
    color: #e8e8e8;
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior: none;
  }
  input, textarea, button { font-family: inherit; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .header {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    padding: 1.25rem 1.25rem 1rem;
    border-bottom: 2px solid #e94560;
    position: sticky; top: 0; z-index: 20;
  }
  .header-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-phase { font-size: 0.6rem; letter-spacing: 0.2em; color: #e94560; text-transform: uppercase; margin-bottom: 0.2rem; }
  .header-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; }
  .btn-ghost {
    background: rgba(233,69,96,0.15); border: 1px solid rgba(233,69,96,0.3);
    color: #e94560; border-radius: 8px; padding: 0.45rem 0.65rem; cursor: pointer;
    font-size: 0.7rem; display: flex; align-items: center; gap: 0.3rem;
  }
  .btn-primary {
    background: #e94560; border: none; color: white; border-radius: 10px;
    padding: 0.85rem; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    letter-spacing: 0.05em; width: 100%;
  }
  .btn-back {
    background: none; border: none; color: #888; cursor: pointer; padding: 0.25rem;
    display: flex; align-items: center; gap: 0.3rem; font-size: 0.7rem;
  }

  .week-selector {
    display: flex; align-items: center; justify-content: center; gap: 1rem;
    padding: 1rem; background: rgba(255,255,255,0.02);
  }
  .week-selector button {
    background: none; border: none; color: #e94560; cursor: pointer; padding: 0.25rem; font-size: 1.1rem;
  }
  .week-selector button:disabled { color: #333; cursor: default; }
  .week-num { font-size: 1.1rem; font-weight: 700; text-align: center; }
  .week-sub { font-size: 0.65rem; color: #888; margin-top: 0.15rem; text-align: center; }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;
    padding: 0 1rem; margin-bottom: 1.25rem;
  }
  .stat-card {
    background: rgba(255,255,255,0.04); border-radius: 10px; padding: 0.75rem 0.5rem;
    text-align: center; border: 1px solid rgba(255,255,255,0.06);
  }
  .stat-value { font-size: 1.3rem; font-weight: 800; color: #e94560; }
  .stat-label { font-size: 0.55rem; color: #666; text-transform: uppercase; letter-spacing: 0.1em; }
  .stat-sub { font-size: 0.55rem; color: #444; }

  .day-btn {
    width: 100%; border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 0.75rem;
    cursor: pointer; text-align: left; border: 1px solid; color: #e8e8e8;
  }
  .day-btn.day-a {
    background: linear-gradient(135deg, rgba(233,69,96,0.12) 0%, rgba(233,69,96,0.04) 100%);
    border-color: rgba(233,69,96,0.25);
  }
  .day-btn.day-b {
    background: linear-gradient(135deg, rgba(21,101,192,0.12) 0%, rgba(21,101,192,0.04) 100%);
    border-color: rgba(21,101,192,0.25);
  }
  .day-btn-label { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem; }
  .day-btn-sub { font-size: 0.7rem; color: #888; }
  .day-btn-exercises { font-size: 0.6rem; color: #555; margin-top: 0.35rem; }

  .section-bar {
    padding: 0.5rem 1.25rem; font-size: 0.6rem; font-weight: 700;
    color: #e94560; letter-spacing: 0.15em; text-transform: uppercase;
    background: rgba(233,69,96,0.06); border-left: 3px solid #e94560;
  }
  .exercise-row {
    padding: 0.75rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .exercise-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.35rem; }
  .exercise-name { font-size: 0.8rem; font-weight: 600; }
  .exercise-target { font-size: 0.7rem; font-weight: 700; color: #e94560; margin-top: 0.15rem; }
  .exercise-meta { font-size: 0.55rem; color: #666; margin-top: 0.15rem; }
  .exercise-last {
    font-size: 0.55rem; color: #555; background: rgba(255,255,255,0.04);
    padding: 0.2rem 0.4rem; border-radius: 4px; white-space: nowrap;
  }

  .set-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
  .set-num { font-size: 0.6rem; color: #555; min-width: 1.25rem; font-weight: 700; }
  .set-input {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px; padding: 0.45rem 0.5rem; color: #e8e8e8;
    font-size: 0.8rem; text-align: center;
  }
  .set-input.weight { width: 4rem; }
  .set-input.reps { width: 3.5rem; }
  .set-input.done { border-color: rgba(233,69,96,0.3); }
  .set-input.prefill { color: #8a8a8a; font-style: italic; }
  .set-check {
    width: 2rem; height: 2rem; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); color: #555; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .set-check.checked { border-color: #e94560; background: rgba(233,69,96,0.2); color: #e94560; }

  .btn-add-set {
    margin-top: 0.35rem; background: none; border: none; color: #555;
    cursor: pointer; font-size: 0.6rem; display: flex; align-items: center; gap: 0.25rem; padding: 0.2rem 0;
  }
  .btn-done-toggle {
    margin-top: 0.25rem; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 6px;
    padding: 0.4rem 0.75rem; color: #666; cursor: pointer;
    font-size: 0.65rem; display: flex; align-items: center; gap: 0.35rem;
  }
  .btn-done-toggle.checked {
    background: rgba(233,69,96,0.15); border-color: rgba(233,69,96,0.3); color: #e94560;
  }

  .session-feel {
    margin: 1rem; padding: 1rem; background: rgba(255,255,255,0.03);
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
  }
  .feel-label { font-size: 0.6rem; color: #e94560; font-weight: 700; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.75rem; }
  .feel-sub { font-size: 0.6rem; color: #888; margin-bottom: 0.35rem; }
  .feel-row { display: flex; gap: 0.35rem; flex-wrap: wrap; margin-bottom: 0.75rem; }
  .feel-btn {
    min-width: 2.25rem; padding: 0.4rem 0.5rem; border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
    color: #888; cursor: pointer; font-size: 0.7rem; font-weight: 600;
  }
  .feel-btn.selected { border-color: #e94560; background: rgba(233,69,96,0.2); color: #e94560; }
  .feel-btn.energy.selected { border-color: #5c9ce6; background: rgba(92,156,230,0.15); color: #5c9ce6; }
  .notes-textarea {
    width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 0.5rem; color: #ccc; font-size: 0.7rem; resize: vertical;
  }

  .floating-finish {
    position: fixed; bottom: 0; left: 0; right: 0; padding: 1rem;
    background: linear-gradient(transparent, #0a0a0f 30%); z-index: 10;
    max-width: 430px; margin: 0 auto;
  }
  .rest-bar {
    display: none; margin-bottom: 0.6rem; background: #1a1a2e;
    border: 1px solid rgba(92,156,230,0.4); border-radius: 12px; padding: 0.6rem 0.75rem;
  }
  .rest-bar.done { border-color: #4ade80; background: rgba(74,222,128,0.12); }
  .rest-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  .rest-label { font-size: 0.6rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rest-time { font-size: 1.6rem; font-weight: 800; color: #5c9ce6; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .rest-bar.done .rest-time { color: #4ade80; }
  .rest-btns { display: flex; gap: 0.35rem; flex-shrink: 0; }
  .rest-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); color: #ccc;
    border-radius: 8px; padding: 0.55rem 0.6rem; font-size: 0.7rem; cursor: pointer; min-width: 2.75rem;
  }
  .rest-progress { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 0.45rem; overflow: hidden; }
  .rest-progress div { height: 100%; background: #5c9ce6; width: 100%; }
  .rest-bar.work { border-color: rgba(233,69,96,0.55); }
  .rest-bar.work .rest-time { color: #e94560; }
  .rest-bar.work .rest-progress div { background: #e94560; }
  .rest-bar.work.switch .rest-time { color: #f5b942; }
  .btn-timer {
    margin: 0.25rem 0 0 0.5rem; background: rgba(233,69,96,0.1); border: 1px solid rgba(233,69,96,0.35);
    color: #e94560; border-radius: 6px; padding: 0.4rem 0.65rem; font-size: 0.65rem; cursor: pointer;
  }
  .btn-timer.small { margin: 0; padding: 0 0.45rem; height: 2rem; min-width: 2rem; font-size: 0.7rem; }
  .btn-rest-chip {
    margin-top: 0.35rem; margin-left: 0.75rem; background: none; border: none; color: #5c9ce6;
    cursor: pointer; font-size: 0.6rem; padding: 0.2rem 0;
  }

  .history-item {
    width: 100%; text-align: left; background: none; border: none;
    border-bottom: 1px solid rgba(255,255,255,0.04); padding: 0.85rem 1.25rem;
    cursor: pointer; color: #e8e8e8; display: flex; justify-content: space-between; align-items: center;
  }
  .history-day { font-size: 0.8rem; font-weight: 600; }
  .history-meta { font-size: 0.6rem; color: #666; margin-top: 0.2rem; }
  .history-weight { font-size: 0.7rem; color: #e94560; font-weight: 700; }

  .detail-tag {
    padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.65rem; font-weight: 600;
  }
  .detail-tag.rpe { background: rgba(233,69,96,0.12); color: #e94560; }
  .detail-tag.energy { background: rgba(92,156,230,0.12); color: #5c9ce6; }
  .detail-set {
    padding: 0.3rem 0.5rem; background: rgba(233,69,96,0.1); border-radius: 5px;
    font-size: 0.65rem; color: #ccc; border: 1px solid rgba(233,69,96,0.2);
  }
  .detail-set.empty { background: rgba(255,255,255,0.03); color: #444; border-color: rgba(255,255,255,0.05); }
  .detail-note {
    margin: 1rem 1.25rem; padding: 0.75rem; background: rgba(255,255,255,0.03);
    border-radius: 8px; border-left: 3px solid rgba(255,255,255,0.1);
  }

  .overview-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0.4rem 0; border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .overview-row.active { opacity: 1; }
  .overview-row.inactive { opacity: 0.4; }

  .btn-delete {
    background: rgba(255,50,50,0.1); border: 1px solid rgba(255,50,50,0.2);
    color: #ff5555; border-radius: 6px; padding: 0.4rem; cursor: pointer;
  }

  .empty-state { text-align: center; padding: 3rem 1rem; color: #444; }
  .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }

  .saving-indicator { text-align: center; padding: 0.5rem; font-size: 0.6rem; color: #e94560; }

  .swap-trigger { cursor: pointer; }
  .swap-hint {
    font-size: 0.5rem; color: #e94560; text-transform: uppercase; letter-spacing: 0.1em;
    margin-left: 0.4rem; opacity: 0.6;
  }
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 50;
  }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
    max-width: 430px; margin: 0 auto;
    background: #1a1a2e; border-top: 2px solid #e94560; border-radius: 14px 14px 0 0;
    padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom));
  }
  .sheet-title { font-size: 0.85rem; font-weight: 700; }
  .sheet-sub { font-size: 0.6rem; color: #888; margin: 0.2rem 0 0.75rem; }
  .swap-option {
    display: flex; justify-content: space-between; width: 100%; text-align: left;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    color: #ddd; padding: 0.85rem; font-size: 0.8rem; cursor: pointer;
    border-radius: 8px; margin-bottom: 0.4rem;
  }
  .swap-option:active { background: rgba(233,69,96,0.15); }
  .swap-option.current { color: #e94560; border-color: rgba(233,69,96,0.4); font-weight: 600; }
  .sheet-cancel {
    width: 100%; background: none; border: none; color: #888; padding: 0.75rem;
    font-size: 0.75rem; cursor: pointer; margin-top: 0.25rem;
  }
  .rotation-tag {
    display: inline-block; font-size: 0.55rem; color: #4ade80; background: rgba(74,222,128,0.1);
    padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.35rem;
  }
  .btn-row { display: flex; gap: 0.5rem; }
  .btn-edit {
    background: rgba(92,156,230,0.12); border: 1px solid rgba(92,156,230,0.3);
    color: #5c9ce6; border-radius: 6px; padding: 0.4rem 0.7rem; cursor: pointer; font-size: 0.65rem;
  }
  .btn-reset {
    display: block; margin: 2rem auto; background: none; border: 1px solid rgba(255,50,50,0.25);
    color: #ff5555; border-radius: 8px; padding: 0.6rem 1rem; font-size: 0.65rem; cursor: pointer;
  }

  @media (min-width: 500px) {
    body { max-width: 430px; margin: 0 auto; border-left: 1px solid #1a1a2e; border-right: 1px solid #1a1a2e; }
  }
</style>
</head>

<div id="app"></div>

}

// Rotation: exercises tagged "odd" run in weeks 1/3/5, "even" in weeks 2/4/6. Untagged run every week.
function inWeek(ex, week) {
  if (!ex.weeks) return true;
  return (ex.weeks === "odd") === (week % 2 === 1);
}
function rotationLabel(week) { return week % 2 === 1 ? "Rotation 1" : "Rotation 2"; }

function findExercise(dayKey, exId) {
  for (const sec of PROGRAM[dayKey].sections) {
    const ex = sec.exercises.find(e => e.id === exId);
    if (ex) return ex;
  }
  return null;
}

function escapeHTML(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function saveData() {
  try {
    localStorage.setItem("the-program-data", JSON.stringify({
      sessions: state.sessions,
      currentWeek: state.currentWeek,
    }));
  } catch(e) {}
}

function todayStr() {
  const d = new Date(); // local date, not UTC (UTC would date Brisbane morning sessions as the day before)
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function formatDate(s) {
  const d = new Date(s + "T00:00:00");
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]}`;
}

// Sets from the most recent saved session that did this exercise (matching swap, if any)
function getLastSets(exerciseId, swapName) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (state.editingId && s.id === state.editingId) continue;
    const d = s.exercises && s.exercises[exerciseId];
    if (!d) continue;
    const used = (s.swaps && s.swaps[exerciseId]) || null;
    if (used !== (swapName || null)) continue;
    const sets = d.sets.filter(x => x.weight !== "" && x.weight != null);
    if (sets.length) return sets;
  }
  return null;
}

// Fill un-ticked sets with last time's weights and this week's target reps.
// Values stay marked "prefill" (greyed) until edited or ticked; untouched + unticked sets are dropped on save.
function prefillSets(ex, exData, week, swapName) {
  const last = getLastSets(ex.id, swapName);
  const wt = WEEK_TARGETS[week] || WEEK_TARGETS[1];
  const nums = String(ex.reps || wt.reps).match(/\d+(\.\d+)?/g) || [];
  exData.sets.forEach((set, i) => {
    if (set.done) return;
    if (!set.pre && (set.weight !== "" || set.reps !== "")) return; // keep anything typed by hand
    const src = last ? (last[i] || last[last.length - 1]) : null;
    let reps = "";
    if (ex.unit === "secs") reps = src && src.reps !== "" ? src.reps : (nums[0] || "");
    else reps = nums.length ? nums[nums.length - 1] : "";
    set.weight = src ? src.weight : "";
    set.reps = reps;
    set.pre = !!(set.weight !== "" || set.reps !== "");
  });
}

function targetText(ex, exData, week) {
  if (!ex.hasWeight) return ex.target || "";
  const wt = WEEK_TARGETS[week] || WEEK_TARGETS[1];
  const sets = Math.min(ex.defaultSets, wt.sets);
  const reps = ex.reps || wt.reps;
  const unit = /[a-z]/i.test(reps) ? "" : " reps";
  return `${sets} × ${reps}${unit}`;
}

function getSessionCount() { return state.sessions.filter(s => s.completed).length; }
function getWeekSessions() { return state.sessions.filter(s => s.week === state.currentWeek && s.completed).length; }

function renderSingaporeCountdown() {
  // Calendar days to 27 Feb (midnight to midnight, local time) — matches the holiday site
  const target = new Date(2027, 1, 27);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = Math.max(0, Math.round((target - today) / (1000*60*60*24)));
  const weeks = Math.floor(days / 7);

  // Running progression phases with date boundaries
  const phases = [
    { id: "gym", label: "Gym Only", sub: "Weeks 1-4 — Build the habit. Two gym sessions per week, walk for cardio.", dateEnd: "2026-11-22", color: "#e94560" },
    { id: "runwalk", label: "Run/Walk", sub: "Weeks 5-10 — Start 1 min run / 2 min walk × 8, twice a week. Add about 30s of running per interval each week, ending with 20 min continuous. Repeat a week any time it felt hard.", dateEnd: "2027-01-03", color: "#f4a261" },
    { id: "continuous", label: "Easy Running + REHIT", sub: "Weeks 11-14 — 20-35 min easy runs, twice a week, at a pace where you can talk. Optional gym finisher: REHIT, 2 × 20s all-out bike sprints with about 3 min easy pedalling between (10 min total).", dateEnd: "2027-01-31", color: "#2a9d8f" },
    { id: "extend", label: "5K+ and 4×4", sub: "Weeks 15-17 — One long easy run, adding about 5 min a week toward 45-60 min. One Norwegian 4×4: 4 min hard (90-95% max HR), 3 min easy jog or brisk walk, × 4.", dateEnd: "2027-02-20", color: "#5c9ce6" },
    { id: "ready", label: "Singapore Ready", sub: "Final week — Ease off: two short easy runs and no hard sessions, so you arrive fresh.", dateEnd: "2027-02-27", color: "#4ade80" },
  ];

  // Determine current phase
  let currentPhase = phases[phases.length - 1];
  for (const phase of phases) {
    if (now <= new Date(phase.dateEnd + "T23:59:59")) {
      currentPhase = phase;
      break;
    }
  }

  let phaseRows = "";
  let foundCurrent = false;
  phases.forEach(p => {
    const isCurrent = p.id === currentPhase.id;
    const isPast = !foundCurrent && !isCurrent;
    if (isCurrent) foundCurrent = true;
    const opacity = isCurrent ? "1" : isPast ? "0.35" : "0.5";
    const border = isCurrent ? `border-left:3px solid ${p.color};padding-left:0.6rem;margin-left:-0.6rem` : "";

    phaseRows += `<div style="padding:0.4rem 0;opacity:${opacity};${border}">
      <div style="display:flex;align-items:center;gap:0.5rem">
        <span style="font-size:0.5rem;width:6px;height:6px;border-radius:50%;background:${p.color};display:inline-block;flex-shrink:0"></span>
        <span style="font-size:0.65rem;font-weight:${isCurrent?'700':'400'};color:${isCurrent?p.color:'#aaa'}">${p.label}</span>
        ${isCurrent?'<span style="font-size:0.5rem;color:#555;background:rgba(255,255,255,0.06);padding:0.1rem 0.35rem;border-radius:3px">NOW</span>':''}
      </div>
      <div style="font-size:0.55rem;color:#666;margin-left:1rem;margin-top:0.15rem">${p.sub}</div>
    </div>`;
  });

  return `
    <div style="margin:1rem 1rem 0;background:linear-gradient(135deg,rgba(74,222,128,0.06) 0%,rgba(92,156,230,0.06) 100%);border-radius:10px;padding:1rem;border:1px solid rgba(74,222,128,0.15)">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.75rem">
        <div>
          <div style="font-size:0.6rem;color:#4ade80;text-transform:uppercase;letter-spacing:0.15em;font-weight:700">Singapore 5/10K</div>
          <div style="font-size:0.55rem;color:#666;margin-top:0.15rem">27 Feb 2027</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:1.4rem;font-weight:800;color:#4ade80">${days}</div>
          <div style="font-size:0.5rem;color:#666;text-transform:uppercase;letter-spacing:0.1em">days (${weeks} wks)</div>
        </div>
      </div>
      <div style="height:1px;background:rgba(255,255,255,0.06);margin-bottom:0.6rem"></div>
      <div style="font-size:0.55rem;color:#555;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.5rem">Running Progression</div>
      ${phaseRows}
      <div style="height:1px;background:rgba(255,255,255,0.06);margin:0.6rem 0"></div>
      <div style="font-size:0.55rem;color:#555;font-style:italic">The test: can you hold a conversation while running? That's the pace.</div>
    </div>
  `;
}

function renderWorkout() {
  const s = state.activeSession;
  const day = PROGRAM[state.activeDay];
  const wt = WEEK_TARGETS[s.week] || WEEK_TARGETS[1];
  const editing = !!state.editingId;

  let sectionsHTML = "";
  day.sections.forEach(section => {
    const exs = section.exercises.filter(ex => s.exercises[ex.id]);
    if (!exs.length) return;
    sectionsHTML += `<div class="section-bar">${section.name}</div>`;
    exs.forEach(ex => {
      const exData = s.exercises[ex.id];
      const lastSets = ex.hasWeight ? getLastSets(ex.id, s.swaps[ex.id] || null) : null;
      let last = lastSets ? lastSets.map(x => x.weight).join("/") + "kg" : null;
      if (!ex.hasWeight) { const ls = getLastSecs(ex.id); if (ls) last = `${ls}s`; }
      const displayName = s.swaps[ex.id] || ex.name;
      const metaParts = [ex.anchor?'Anchor lift':'', ex.tempo||'', ex.rest?`Rest: ${ex.rest}`:'', ex.note].filter(Boolean).join(" • ");
      const hasSwaps = ex.swaps && ex.swaps.length > 0;
      const secondField = ex.unit === "secs" ? "secs" : "reps";

      let setsHTML = "";
      if (ex.hasWeight) {
        exData.sets.forEach((set, idx) => {
          const doneClass = set.done ? "done" : "";
          const checkClass = set.done ? "checked" : "";
          setsHTML += `<div class="set-row">
            <div class="set-num">${idx+1}</div>
            <input type="number" inputmode="decimal" placeholder="kg" value="${escapeHTML(set.weight)}" class="set-input weight ${doneClass} ${set.pre?'prefill':''}" oninput="updateSet('${ex.id}',${idx},'weight',this.value,this)">
            <input type="number" inputmode="numeric" placeholder="${secondField}" value="${escapeHTML(set.reps)}" class="set-input reps ${doneClass} ${set.pre?'prefill':''}" oninput="updateSet('${ex.id}',${idx},'reps',this.value,this)">
            ${ex.unit === "secs" && !set.done ? `<button class="btn-timer small" onclick="startWorkTimer('${ex.id}',${idx})" aria-label="Start timer">▶</button>` : ''}
            <button class="set-check ${checkClass}" onclick="toggleSet('${ex.id}',${idx})">${ICO.check}</button>
          </div>`;
        });
        const restSecs = parseRest(ex.rest);
        setsHTML += `<div style="display:flex;align-items:center">
          <button class="btn-add-set" onclick="addSet('${ex.id}')">${ICO.plus} Add set</button>
          ${restSecs ? `<button class="btn-rest-chip" onclick="startRest(${restSecs}, '${ex.id}')">⏱ Rest ${formatClock(restSecs)}</button>` : ''}
        </div>`;
      } else {
        const checkClass = exData.sets[0]?.done ? "checked" : "";
        const spec = timerSpec(ex);

        setsHTML = `<div style="display:flex;align-items:center">
          <button class="btn-done-toggle ${checkClass}" onclick="toggleSet('${ex.id}',0)">${ICO.check} ${exData.sets[0]?.done?(secsDone?`Done · ${secsDone}s`:'Done'):'Mark done'}</button>
          ${spec && !exData.sets[0]?.done ? `<button class="btn-timer" onclick="startWorkTimer('${ex.id}',0)">▶ ${escapeHTML(spec.chip)}</button>` : ''}
        </div>`;

      sectionsHTML += `<div class="exercise-row">
        <div class="exercise-header">
          <div class="${hasSwaps?'swap-trigger':''}" ${hasSwaps?`onclick="openSwap('${ex.id}')"`:''}>

  let sheetHTML = "";

    const ex = findExercise(state.activeDay, state.openSwapMenu);

      const current = s.swaps[ex.id];
      let opts = `<button class="swap-option ${!current?'current':''}" onclick="swapExercise('${ex.id}',-1)"><span>${escapeHTML(ex.name)}</span><span>${!current?'✓':'Default'}</span></button>`;

        opts += `<button class="swap-option ${isCur?'current':''}" onclick="swapExercise('${ex.id}',${i})"><span>${escapeHTML(sw)}</span><span>${isCur?'✓':''}</span></button>`;

// ==================== ACTIONS ====================
function goHome() { state.view="home"; state.viewingSession=null; render(); }
function goHistory() { state.view="history"; state.viewingSession=null; render(); }

function changeWeek(delta) {
  state.currentWeek = Math.max(1, Math.min(6, state.currentWeek + delta));
  saveData(); render();
}

function startWorkout(dayKey) {
  const day = PROGRAM[dayKey];
  const wt = WEEK_TARGETS[state.currentWeek];
  const session = {
    id: Date.now().toString(),
    date: todayStr(),
    dayKey, dayLabel: day.label,
    week: state.currentWeek,
    exercises: {},
    swaps: {},
    note: "", rpe: null, energy: null, completed: false,
  };
  day.sections.forEach(section => {
    section.exercises.filter(ex => inWeek(ex, state.currentWeek)).forEach(ex => {
      if (ex.hasWeight) {
        const n = Math.min(ex.defaultSets, wt.sets);
        session.exercises[ex.id] = { sets: Array.from({length:n}, ()=>({weight:"",reps:"",done:false})) };
        prefillSets(ex, session.exercises[ex.id], state.currentWeek, null);
      } else {
        session.exercises[ex.id] = { sets: [{done:false}] };
      }
    });
  });
  state.activeSession = session;
  state.activeDay = dayKey;
  state.sessionRPE = null;
  state.energyLevel = null;
  state.sessionNote = "";
  state.editingId = null;
  state.openSwapMenu = null;
  state.view = "workout";
  saveDraft();
  render();
  window.scrollTo(0,0);
}

function updateSet(exId, idx, field, value, el) {
  const set = state.activeSession.exercises[exId].sets[idx];
  set[field] = value;
  if (set.pre) {
    set.pre = false;
    if (el && el.parentElement) el.parentElement.querySelectorAll('.prefill').forEach(n => n.classList.remove('prefill'));
  }
  saveDraft();
}

function toggleSet(exId, idx) {
  const set = state.activeSession.exercises[exId].sets[idx];
  set.done = !set.done;
  if (set.done) set.pre = false; else delete set.secs;
  if (set.done && !state.editingId) {
    const ex = findExercise(state.activeDay, exId);
    const secs = ex && ex.hasWeight ? parseRest(ex.rest) : 0;
    if (secs) startRest(secs, exId, true);
  }
  saveDraft();
  render();
}

function addSet(exId) {
  const sets = state.activeSession.exercises[exId].sets;
  const prev = sets[sets.length - 1];
  sets.push(prev && (prev.weight !== "" || prev.reps !== "")
    ? {weight:prev.weight, reps:prev.reps, done:false, pre:true}
    : {weight:"",reps:"",done:false});
  saveDraft();
  render();
}

function openSwap(exId) {
  state.openSwapMenu = exId;
  render();
}

function closeSwapMenu() {
  state.openSwapMenu = null;
  render();
}

function swapExercise(exId, idx) {
  const ex = findExercise(state.activeDay, exId);
  if (ex && idx >= 0 && ex.swaps[idx]) {
    state.activeSession.swaps[exId] = ex.swaps[idx];
  } else {
    delete state.activeSession.swaps[exId];
  }
  const exData = state.activeSession.exercises[exId];
  if (ex && ex.hasWeight && exData) prefillSets(ex, exData, state.activeSession.week, state.activeSession.swaps[exId] || null);
  state.openSwapMenu = null;
  saveDraft();
  render();
}

function setRPE(val) { state.sessionRPE = val; saveDraft(); render(); }
function setEnergy(val) { state.energyLevel = val; saveDraft(); render(); }

function endActiveSession() {
  state.rest = null; state.work = null; restDoneUntil = 0; updateRestBar();
  state.activeSession = null; state.activeDay = null;
  state.editingId = null; state.openSwapMenu = null;
  clearDraft();
}

function cancelWorkout() {
  const editingId = state.editingId;
  const msg = editingId ? "Discard your changes?" : "Leave without saving?";
  if (!confirm(msg)) return;
  endActiveSession();
  if (editingId) {
    state.viewingSession = state.sessions.find(s => s.id === editingId);
    state.view = "detail";
  } else {
    state.view = "home";
  }
  render();
  window.scrollTo(0,0);
}

function finishWorkout() {
  const s = state.activeSession;
  s.note = state.sessionNote;
  s.rpe = state.sessionRPE;
  s.energy = state.energyLevel;
  s.completed = true;
  Object.values(s.exercises).forEach(d => (d.sets || []).forEach(x => {
    if (x.pre && !x.done) { x.weight = ""; x.reps = ""; }
    delete x.pre;
  }));
  const editingId = state.editingId;
  if (editingId) {
    const i = state.sessions.findIndex(x => x.id === editingId);
    if (i >= 0) state.sessions[i] = s; else state.sessions.push(s);
  } else {
    state.sessions.push(s);
  }
  saveData();
  endActiveSession();
  if (editingId) {
    state.viewingSession = s;
    state.view = "detail";
  } else {
    state.view = "home";
  }
  render();
  window.scrollTo(0,0);
}

function editSession(id) {
  const orig = state.sessions.find(s => s.id === id);
  if (!orig) return;
  const copy = JSON.parse(JSON.stringify(orig));
  copy.swaps = copy.swaps || {};
  state.activeSession = copy;
  state.activeDay = copy.dayKey;
  state.sessionRPE = copy.rpe ?? null;
  state.energyLevel = copy.energy ?? null;
  state.sessionNote = copy.note || "";
  state.editingId = id;
  state.openSwapMenu = null;
  state.view = "workout";
  saveDraft();
  render();
  window.scrollTo(0,0);
}

function buildExportText() {
  const sorted = [...state.sessions].sort((a,b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
  const lines = [`THE PROGRAM — training log (${sorted.length} sessions, exported ${todayStr()})`, ""];
  sorted.forEach(s => {
    const day = PROGRAM[s.dayKey];
    const wt = WEEK_TARGETS[s.week] || {};
    lines.push(`${formatDate(s.date)} ${s.date.slice(0,4)} | ${s.dayLabel} | Week ${s.week} (target ${wt.reps||'?'} reps @ RPE ${wt.rpe||'?'}) | Session RPE ${s.rpe ?? '-'} | Energy ${s.energy ?? '-'}`);
    const skipped = [];
    day.sections.forEach(sec => {
      sec.exercises.forEach(ex => {
        const d = s.exercises[ex.id];
        if (!d) return;
        const name = (s.swaps && s.swaps[ex.id]) ? `${s.swaps[ex.id]} (swapped from ${ex.name})` : ex.name;
        if (ex.hasWeight) {
          const sets = d.sets.filter(x => x.weight || x.reps)
            .map(x => `${x.weight||'BW'}kg×${x.reps||'?'}${ex.unit==='secs'?'s':''}`);
          lines.push(`  ${name}: ${sets.length ? sets.join(", ") : "not logged"}`);
        } else if (!d.sets[0]?.done) {
          skipped.push(name);
        } else if (d.sets[0].secs) {
          lines.push(`  ${name}: ${d.sets[0].secs}s`);
        }
      });
    });
    if (skipped.length) lines.push(`  Skipped: ${skipped.join(", ")}`);
    if (s.note) lines.push(`  Notes: ${s.note.replace(/\s+/g," ")}`);
    lines.push("");
  });
  return lines.join("\n");
}

function exportForReview() {
  const text = buildExportText();
  const status = document.getElementById("export-status");
  const fallback = document.getElementById("export-fallback");
  const showFallback = () => {
    fallback.style.display = "block"; fallback.value = text; fallback.focus(); fallback.select();
    status.textContent = "Couldn't copy automatically. Select all the text below and copy it.";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => { status.textContent = "Copied. Paste it into a chat with Claude."; status.style.color = "#4ade80"; })
      .catch(showFallback);
  } else {
    showFallback();
  }
}

function resetAll() {
  if (!confirm("Delete ALL saved sessions on this phone and start fresh at Week 1? This can't be undone. (Files you've saved to Google Drive are kept.)")) return;
  state.sessions = [];
  state.currentWeek = 1;
  endActiveSession();

function viewSession(id) {
  state.viewingSession = state.sessions.find(s => s.id === id);

// ==================== REST TIMER ====================
// Timer is based on an end timestamp, so it stays correct even if the phone throttles the page.
let restDoneUntil = 0;   // show "Go" state until this time after rest finishes
let audioCtx = null;
let wakeLock = null;

function parseRest(str) {
  if (!str) return 0;
  const min = /(\d+(?:\.\d+)?)\s*min/i.exec(str);
  if (min) return Math.round(parseFloat(min[1]) * 60);
  const sec = /(\d+)\s*s/i.exec(str);
  return sec ? parseInt(sec[1], 10) : 0;
}

function formatClock(secs) {
  secs = Math.max(0, Math.ceil(secs));
  return `${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`;
}

function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e) {}
}

function beep(times) {
  if (!audioCtx) return;
  try {
    for (let i = 0; i < times; i++) {
      const t = audioCtx.currentTime + i * 0.25;
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.frequency.value = 880; osc.type = "sine";
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.4, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.2);
    }
  } catch(e) {}
}

function startRest(secs, exId, auto) {
  unlockAudio();
  const ex = findExercise(state.activeDay, exId);
  const name = ex ? ((state.activeSession.swaps && state.activeSession.swaps[exId]) || ex.name) : "";
  state.work = null;
  state.rest = { end: Date.now() + secs * 1000, total: secs, label: name };
  restDoneUntil = 0;
  saveDraft();
  updateRestBar();
}

function adjustRest(delta) {
  if (!state.rest) return;
  state.rest.end += delta * 1000;
  state.rest.total = Math.max(state.rest.total + delta, 1);
  if (state.rest.end <= Date.now()) { skipRest(); return; }
  saveDraft();
  updateRestBar();
}

function skipRest() {
  state.rest = null; restDoneUntil = 0;
  saveDraft();
  updateRestBar();
}

// ==================== WORK TIMER (holds, stretches, carries, hangs) ====================
// Fixed holds count down (with a 5s "switch" between sides). Ranges like 30-60s and carries
// count up like a stopwatch, beep at the low and high end, and save the time when stopped.
const SWITCH_SECS = 5;

function timerSpec(ex) {
  const t = ex.hasWeight ? (ex.unit === "secs" ? (ex.reps || "") : "") : (ex.target || "");
  if (!t) return null;
  const sides = /each side|each leg|each arm/i.test(t) ? 2 : 1;
  const rounds = (/^(\d+)\s*×/.exec(t) || [])[1] | 0 || 1;
  if (/per area/i.test(t)) {
    const m = /(\d+(?:\.\d+)?)\s*min/i.exec(t);
    const parts = (ex.name.split("—")[1] || "").split(",").map(x => x.trim()).filter(Boolean);
    const secs = m ? Math.round(parseFloat(m[1]) * 60) : 60;
    return { kind: "down", secs, areas: parts.length ? parts : ["Area 1","Area 2","Area 3"], rounds: 1, sides: 1,
             chip: `${parts.length || 3} × ${formatClock(secs)}` };
  }
  const range = /(\d+)\s*-\s*(\d+)\s*s\b/i.exec(t);
  if (range) return { kind: "up", min: +range[1], max: +range[2], rounds, sides: 1, chip: `Stopwatch ${range[1]}–${range[2]}s` };
  let secs = 0;
  const min = /(\d+(?:\.\d+)?)\s*min/i.exec(t), sec = /(\d+)\s*s\b/i.exec(t);
  if (min) secs = Math.round(parseFloat(min[1]) * 60); else if (sec) secs = +sec[1];
  if (!secs) return null;
  const total = rounds * sides;
  return { kind: "down", secs, rounds, sides, chip: total > 1 ? `${formatClock(secs)} × ${total}` : formatClock(secs) };
}

function getLastSecs(exerciseId) {
  for (let i = state.sessions.length - 1; i >= 0; i--) {
    const s = state.sessions[i];
    if (state.editingId && s.id === state.editingId) continue;
    const d = s.exercises && s.exercises[exerciseId];
    if (d && d.sets && d.sets[0] && d.sets[0].secs) return d.sets[0].secs;
  }
  return null;
}

function startWorkTimer(exId, setIdx) {
  unlockAudio();
  const ex = findExercise(state.activeDay, exId);
  if (!ex) return;
  const spec = timerSpec(ex) || { kind: "up", min: 0, max: 0, rounds: 1, sides: 1 };
  const label = (state.activeSession.swaps && state.activeSession.swaps[exId]) || ex.name;
  const phases = [];
  if (spec.areas) {
    spec.areas.forEach((a, i) => {
      if (i) phases.push({ kind: "switch", secs: SWITCH_SECS, label: "next: " + a });
      phases.push({ kind: "down", secs: spec.secs, label: a });
    });
  } else if (spec.kind === "up" || ex.hasWeight && spec.sides === 1) {
    // stopwatch: ranges, and carries (time gets saved into the set)
    phases.push({ kind: "up", min: spec.min || spec.secs || 0, max: spec.max || 0, label: "" });
  } else {
    // one round at a time for multi-round holds (e.g. side plank 2 × 30s each side) when timing a weighted set
    const rounds = ex.hasWeight ? 1 : spec.rounds;
    for (let r = 0; r < rounds; r++) for (let sd = 0; sd < spec.sides; sd++) {
      const n = phases.length;
      const lbl = [rounds > 1 ? `round ${r+1}` : "", spec.sides > 1 ? (sd ? "side 2" : "side 1") : ""].filter(Boolean).join(", ");
      if (n) phases.push({ kind: "switch", secs: SWITCH_SECS, label: "switch" + (lbl ? " → " + lbl : "") });
      phases.push({ kind: "down", secs: spec.secs, label: lbl });
    }
  }
  state.rest = null; restDoneUntil = 0;
  state.work = { exId, setIdx, label, phases, i: 0, phaseStart: Date.now(), beeped: 0, recordSecs: ex.hasWeight && spec.kind !== "up" ? spec.secs : null };
  beep(1);
  saveDraft();
  updateRestBar();
}

function stopWorkTimer(keep) {
  const w = state.work;
  if (!w) return;
  state.work = null;
  if (keep && state.activeSession && state.activeSession.exercises[w.exId]) {
    const ph = w.phases[w.i];
    const set = state.activeSession.exercises[w.exId].sets[w.setIdx];
    const ex = findExercise(state.activeDay, w.exId);
    let secs = w.recordSecs;
    if (ph.kind === "up") secs = Math.round((Date.now() - w.phaseStart) / 1000);
    if (set) {
      if (ex && ex.hasWeight) { if (secs) set.reps = String(secs); set.pre = false; }
      else if (ph.kind === "up" && secs) set.secs = secs;
      if (!set.done) { saveDraft(); toggleSet(w.exId, w.setIdx); return; }
    }
  }
  saveDraft();
  render();
}

function workTick() {
  const w = state.work;
  if (!w) return;
  const ph = w.phases[w.i];
  const el = (Date.now() - w.phaseStart) / 1000;
  if (ph.kind === "up") {
    if (ph.min && el >= ph.min && w.beeped < 1) { w.beeped = 1; beep(1); try { navigator.vibrate && navigator.vibrate(200); } catch(e) {} saveDraft(); }
    if (ph.max && el >= ph.max && w.beeped < 2) { w.beeped = 2; beep(2); try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e) {} saveDraft(); }
    return;
  }
  if (el < ph.secs) {
    // countdown pips for the last 3 seconds of a work phase
    const left = Math.ceil(ph.secs - el);
    if (ph.kind === "down" && left <= 3 && w.pip !== left) { w.pip = left; beep(1); }
    return;
  }
  w.pip = null;
  if (w.i < w.phases.length - 1) {
    w.i++; w.phaseStart = Date.now();
    beep(ph.kind === "switch" ? 1 : 2);
    try { navigator.vibrate && navigator.vibrate(300); } catch(e) {}
    saveDraft();
    return;
  }
  try { navigator.vibrate && navigator.vibrate([300,150,300,150,300]); } catch(e) {}
  beep(3);
  stopWorkTimer(true);
}

function restTick() {
  workTick();
  if (state.rest && Date.now() >= state.rest.end) {
    state.rest = null;
    restDoneUntil = Date.now() + 4000;
    try { if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]); } catch(e) {}
    beep(3);
    saveDraft();
  }
  updateRestBar();
}

function updateRestBar() {
  const bar = document.getElementById("rest-bar");
  if (!bar) return;
  const now = Date.now();
  const workOn = !!state.work;
  bar.classList.toggle("work", workOn);
  document.getElementById("rest-ctrls").style.display = workOn ? "none" : "flex";
  document.getElementById("work-ctrls").style.display = workOn ? "flex" : "none";
  if (workOn) {
    const w = state.work, ph = w.phases[w.i];
    const el = (now - w.phaseStart) / 1000;
    bar.style.display = "block"; bar.classList.remove("done");
    bar.classList.toggle("switch", ph.kind === "switch");
    document.getElementById("rest-label").textContent = `${w.label}${ph.label ? " — " + ph.label : ""}`;
    let pct;
    if (ph.kind === "up") {
      document.getElementById("rest-time").textContent = formatClock(Math.floor(el));
      pct = Math.min(100, el / (ph.max || ph.min || 60) * 100);
    } else {
      document.getElementById("rest-time").textContent = formatClock(ph.secs - el);
      pct = Math.max(0, Math.min(100, (ph.secs - el) / ph.secs * 100));
    }
    document.getElementById("rest-progress").style.width = `${pct}%`;
    document.getElementById("work-stop").textContent = ph.kind === "up" ? "Stop" : "Done";
    return;
  }
  bar.classList.remove("switch");
  if (state.rest) {
    const remaining = (state.rest.end - now) / 1000;
    bar.style.display = "block"; bar.classList.remove("done");
    document.getElementById("rest-label").textContent = `Rest${state.rest.label ? " — " + state.rest.label : ""}`;
    document.getElementById("rest-time").textContent = formatClock(remaining);
    document.getElementById("rest-progress").style.width = `${Math.max(0, Math.min(100, remaining / state.rest.total * 100))}%`;
  } else if (restDoneUntil > now) {
    bar.style.display = "block"; bar.classList.add("done");
    document.getElementById("rest-label").textContent = "Rest done";
    document.getElementById("rest-time").textContent = "Go";
    document.getElementById("rest-progress").style.width = "0%";
  } else {
    bar.style.display = "none";
  }
}

// Keep the screen on during a workout so the timer can buzz (a locked phone can't).
async function syncWakeLock() {
  const want = state.view === "workout" && !!state.activeSession && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!want && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
  } catch(e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", syncWakeLock);


// ==================== SAVE LOG TO GOOGLE DRIVE ====================
// Builds a text file (readable log + CSV data) and hands it to the phone's share menu,
// where "Drive" saves it to Google Drive. Falls back to a normal download on a computer.
const DRIVE_KEY = "the-program-drivesave";

function sessionRows(s) {
  const day = PROGRAM[s.dayKey];
  const sets = [], skipped = [];
  day.sections.forEach(sec => {
    sec.exercises.forEach(ex => {
      const d = s.exercises[ex.id];
      if (!d) return;
      const swapped = s.swaps && s.swaps[ex.id];
      const name = swapped || ex.name;
      if (ex.hasWeight) {
        d.sets.forEach((x, i) => {
          if (x.weight === "" && x.reps === "" && !x.done) return;
          const w = parseFloat(x.weight), r = parseFloat(x.reps);
          sets.push({
            section: sec.name[0] + sec.name.slice(1).toLowerCase(),
            exerciseId: ex.id, exercise: name, swappedFrom: swapped ? ex.name : "",
            anchor: !!ex.anchor, set: i + 1,
            weight: isNaN(w) ? "" : w, reps: isNaN(r) ? "" : r,
            unit: ex.unit === "secs" ? "secs" : "reps", done: !!x.done,
          });
        });
      } else if (!d.sets[0]?.done) {
        skipped.push(name);
      } else if (d.sets[0].secs) {
        sets.push({
          section: sec.name[0] + sec.name.slice(1).toLowerCase(),
          exerciseId: ex.id, exercise: name, swappedFrom: "", anchor: false, set: 1,
          weight: "", reps: d.sets[0].secs, unit: "secs", done: true,
        });
      }
    });
  });
  return {
    id: String(s.id), date: s.date, day: s.dayLabel, week: s.week, rotation: rotationLabel(s.week),
    rpe: s.rpe ?? "", energy: s.energy ?? "", notes: s.note || "", skipped, sets,
  };
}

function csvCell(v) {
  const t = String(v ?? "");
  return /[",\n\r]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
}

function buildDriveFileText() {
  const sorted = [...state.sessions].sort((a,b) => a.date.localeCompare(b.date) || String(a.id).localeCompare(String(b.id)));
  const data = sorted.map(sessionRows);
  const sessionsCsv = [["Session ID","Date","Day","Week","Rotation","Session RPE","Energy","Skipped","Notes"]]
    .concat(data.map(d => [d.id, d.date, d.day, d.week, d.rotation, d.rpe, d.energy, d.skipped.join("; "), d.notes.replace(/\s+/g, " ")]))
    .map(r => r.map(csvCell).join(",")).join("\n");
  const setsCsv = [["Session ID","Date","Day","Week","Section","Exercise ID","Exercise","Swapped from","Anchor lift","Set","Weight (kg)","Reps / secs","Unit","Done"]]
    .concat(data.flatMap(d => d.sets.map(x => [d.id, d.date, d.day, d.week, x.section, x.exerciseId, x.exercise, x.swappedFrom, x.anchor ? "Yes" : "", x.set, x.weight, x.reps, x.unit, x.done ? "Yes" : ""])))
    .map(r => r.map(csvCell).join(",")).join("\n");
  return [
    buildExportText(),
    "==================== DATA: SESSIONS (CSV) ====================",
    sessionsCsv,
    "",
    "==================== DATA: SETS (CSV) ====================",
    setsCsv,
    "",
  ].join("\n");
}

function driveStatusText() {
  try {
    const d = JSON.parse(localStorage.getItem(DRIVE_KEY));
    if (d && d.at) return `Last saved: ${formatDate(d.at.slice(0,10))} (${d.count} session${d.count === 1 ? "" : "s"})`;
  } catch(e) {}
  return "Not saved to Drive yet";
}

async function saveLogToDrive() {
  const status = document.getElementById("drive-status");
  const say = (t, c) => { if (status) { status.textContent = t; status.style.color = c || "#888"; } };
  const text = buildDriveFileText();
  const name = `training-log-${todayStr()}.txt`;
  const markSaved = () => {
    try { localStorage.setItem(DRIVE_KEY, JSON.stringify({ at: todayStr(), count: state.sessions.length })); } catch(e) {}
  };
  let file = null;
  try { file = new File([text], name, { type: "text/plain" }); } catch(e) {}

  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: name });
      markSaved();
      say(`Sent ${name}. In the share menu, pick Drive → Gym Tracker folder → Save.`, "#4ade80");
    } catch(e) {
      if (e && e.name === "AbortError") say("Cancelled. Nothing was saved.");
      else say("Couldn't open the share menu. Use Copy training log instead.", "#ff5555");
    }
    return;
  }
  // Computer or older browser: download the file instead
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    markSaved();
    say(`Downloaded ${name}. Upload it to the Gym Tracker folder in Google Drive.`, "#4ade80");
  } catch(e) {
    say("Couldn't save the file. Use Copy training log instead.", "#ff5555");
  }
}

// ==================== INIT ====================
loadData();
render();
setInterval(restTick, 250);
// Belt and braces: save the in-progress session whenever the app is hidden (screen lock, app switch)
document.addEventListener("visibilitychange", () => { if (document.hidden) saveDraft(); });
window.addEventListener("pagehide", saveDraft);
</script>
